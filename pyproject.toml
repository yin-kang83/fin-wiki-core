[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-wiki"
version = "0.2.0"
description = "Deterministic, evidence-traceable finance computation core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fin-Wiki contributors" }]
keywords = ["accounting", "audit", "temporal", "deterministic", "decimal", "dag"]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["fin_wiki"]

[tool.pytest.ini_options]
testpaths = ["fin_wiki/tests"]
addopts = "-q"
