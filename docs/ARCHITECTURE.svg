<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="980" fill="#f8fafc"/>
  <text x="50" y="56" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Fin-Wiki 架构</text>
  <text x="50" y="88" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#475569">LLM 只读只抽参 · 事实追加不覆盖 · 计算只走 Decimal 算子 · 规则按业务时点选版本</text>

  <!-- input -->
  <rect x="40" y="170" width="190" height="120" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="205" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0f172a">输入</text>
  <text x="135" y="232" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">文档 · 合同</text>
  <text x="135" y="253" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">法规 · 年报</text>
  <line x1="230" y1="230" x2="300" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- central stack -->
  <rect x="300" y="140" width="650" height="700" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="625" y="172" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">open-source core</text>

  <!-- layer 1 -->
  <rect x="335" y="190" width="580" height="82" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="355" y="219" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">证据层 · Evidence</text>
  <text x="355" y="246" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">SourceSpan（doc + version + range + sha256） → FactCandidate</text>
  <line x1="625" y1="272" x2="625" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- layer 2 -->
  <rect x="335" y="300" width="580" height="82" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="355" y="329" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#155e75">契约 / 适配层 · Adapter</text>
  <text x="355" y="356" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">WikiAwareAdapter · 全部候选校验通过才提交 · 来源不可回指即拒绝</text>
  <line x1="625" y1="382" x2="625" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- layer 3 -->
  <rect x="335" y="410" width="580" height="98" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="355" y="439" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#166534">双时态账本 · Temporal Fact Store</text>
  <text x="355" y="466" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">append-only · valid_from/to + recorded_at · supersedes 修正</text>
  <text x="355" y="488" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">prev_hash / record_hash · 按业务日 + 记录时点可见</text>
  <line x1="625" y1="508" x2="625" y2="536" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- layer 4 -->
  <rect x="335" y="536" width="580" height="82" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="355" y="565" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#854d0e">计算层 · Execution Engine</text>
  <text x="355" y="592" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">纯 Decimal 算子 · DAG 依赖/循环检测 · DerivedRecord 血缘（fact_id + formula）</text>
  <line x1="625" y1="618" x2="625" y2="646" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- layer 5 -->
  <rect x="335" y="646" width="580" height="82" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="355" y="675" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#6b21a8">规则层 · Rules</text>
  <text x="355" y="702" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">RuleBook / RuleVersion → ApplicabilityResolver（业务日 · 报表期 · 过渡条款 · 提前适用）</text>
  <line x1="625" y1="728" x2="625" y2="756" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- layer 6 -->
  <rect x="335" y="756" width="580" height="58" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="355" y="783" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#9f1239">分析层 · CaseEvaluator</text>
  <text x="355" y="805" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#334155">披露版本 vs 适用版本 → 一致 / 需人工；不直接判“违规”</text>

  <!-- right callouts -->
  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="990" y="190" width="210" height="88" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1008" y="218" font-size="14" font-weight="700" fill="#92400e">LLM 只读</text>
    <text x="1008" y="242" font-size="12" fill="#334155">只产出候选事实</text>
    <text x="1008" y="262" font-size="12" fill="#334155">不写账、不算数</text>

    <rect x="990" y="300" width="210" height="88" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1008" y="328" font-size="14" font-weight="700" fill="#991b1b">Fail-Closed</text>
    <text x="1008" y="352" font-size="12" fill="#334155">缺参 / 冲突 / 来源非法</text>
    <text x="1008" y="372" font-size="12" fill="#334155">一律拒绝</text>

    <rect x="990" y="410" width="210" height="98" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="1008" y="438" font-size="14" font-weight="700" fill="#166534">事实不可变</text>
    <text x="1008" y="462" font-size="12" fill="#334155">修正 = 新记录 + supersedes</text>
    <text x="1008" y="484" font-size="12" fill="#334155">不覆盖历史</text>

    <rect x="990" y="536" width="210" height="104" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="1008" y="564" font-size="14" font-weight="700" fill="#3730a3">派生有血缘</text>
    <text x="1008" y="588" font-size="12" fill="#334155">输入 fact_id</text>
    <text x="1008" y="610" font-size="12" fill="#334155">算子版本 + 公式</text>
  </g>

  <!-- bottom output -->
  <line x1="625" y1="814" x2="625" y2="842" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="842" width="470" height="54" rx="12" fill="#0f172a"/>
  <text x="625" y="875" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">输出：可审计事实 · 派生结果 · 案例初筛</text>

  <text x="50" y="944" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">Fin-Wiki v0.1.0 · MIT · 真实年报/题库/客户数据不在开源范围</text>
</svg>
